services:
  php:
    build: ./docker/php
    container_name: katoc_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "mysql://katoc:katoc@db:3306/katoc?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: katoc_nginx
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: katoc_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: katoc
      MYSQL_USER: katoc
      MYSQL_PASSWORD: katoc
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: katoc_phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
  vendor_data:
  var_data:
