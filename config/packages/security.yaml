security:
    access_denied_url: app_admin_access_denied
    role_hierarchy:
        ROLE_ADMIN: [ROLE_HOSPITAL_ADMIN, ROLE_USER]
        ROLE_HOSPITAL_ADMIN: [ROLE_HOSPITAL_STAFF, ROLE_USER]
        ROLE_HOSPITAL_STAFF: [ROLE_USER]
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_home
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/signup$, roles: PUBLIC_ACCESS }
        - { path: ^/admin-access-denied$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/signup$, roles: PUBLIC_ACCESS }
        - { path: ^/hospital-admin, roles: ROLE_HOSPITAL_STAFF }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/booking, roles: ROLE_USER }
